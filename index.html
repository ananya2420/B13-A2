<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave - Tech Insights, AI, and Personal Growth Podcast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar Section -->
    <header class="header">
        <div class="nav-container">
            <!-- Logo on Left -->
            <div class="logo">
                <span>TechWave</span>
            </div>

            <!-- Menu Items in Center (Desktop) -->
            <nav class="nav-menu">
                <a href="#about">About</a>
                <a href="#episodes">Episodes</a>
                <a href="#host">Host</a>
            </nav>

            <!-- Gradient Button on Right (Desktop) -->
            <div class="nav-btn-container">
                <a href="#episodes" class="btn gradient-btn">Listen & Subscribe</a>
            </div>

            <!-- Mobile Hamburger Toggle (Pure CSS Checkbox Hack) -->
            <div class="hamburger-container">
                <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
                <label for="nav-toggle" class="hamburger-btn">
                    <img src="assets/hamburger-menu.png" alt="Menu">
                </label>

                <!-- Mobile Menu Dropdown (Controlled via CSS) -->
                <div class="mobile-menu">
                    <a href="#about">About</a>
                    <a href="#episodes">Episodes</a>
                    <a href="#host">Host</a>
                    <a href="#episodes" class="btn gradient-btn">Listen & Subscribe</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Banner Section -->
    <section class="banner-section" style="background-image: url('assets/hero-bg.png');">
        <div class="banner-content">
            <!-- Podcast Circle View with Visual Effects & New Badge -->
            <div class="podcast-circle-wrapper">
                <div class="soundwave-bg">
                    <img src="assets/hero-circle.png" alt="Soundwave Effect">
                </div>
                <div class="podcast-circle gradient-border-bg">
                    <div class="podcast-circle-inner">
                        <img src="assets/microphone.png" alt="Microphone">
                    </div>
                    <span class="new-badge">NEW</span>
                </div>
            </div>

           

</body>
</html>
